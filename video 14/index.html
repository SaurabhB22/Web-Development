<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to CSS</title>
    <style>
        div{
            background-color: yellow;
            color: blueviolet;
        }
        span{
            background-color: lightseagreen;
            color: darkorange;
        }
        p{
            background-color: aqua;
            color: brown;
        }
    </style>
</head>
<body>
    <div>
        Hey I am Saurabh and I am good
    </div>
    <span>
        My mood is good today
    </span>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Veniam eius veritatis autem quas explicabo perferendis voluptatum ab tempora, ipsum accusamus ex quis sequi, quibusdam cum harum necessitatibus numquam, debitis aliquid!
    </p>
</body>
</html>
